{% extends "base.html" %}
{% block content %}

<style>
.profile-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    font-family: 'Poppins', sans-serif;
}

.profile-card {
    background: rgba(255,255,255,0.95);
    padding: 30px;
    width: 340px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    backdrop-filter: blur(10px);
}

.profile-card h2 {
    margin-bottom: 20px;
    color: #0072ff;
    font-size: 22px;
}

.input-box {
    margin-bottom: 15px;
}

.input-box input,
.input-box select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.input-box input:focus,
.input-box select:focus {
    border-color: #0072ff;
    box-shadow: 0 0 5px rgba(0,114,255,0.4);
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: linear-gradient(135deg, #0072ff, #00c6ff);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.03);
}

.subtitle {
    font-size: 13px;
    color: gray;
    margin-bottom: 15px;
}
</style>

<div class="profile-container">

    <div class="profile-card">

        <h2>👤 Complete Profile</h2>
        <p class="subtitle">Fill your details to continue</p>

        <form method="POST">

            <div class="input-box">
                <input type="number" name="age" placeholder="Enter Age" required>
            </div>

            <div class="input-box">
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>s
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="input-box">
                <input type="text" name="address" placeholder="Enter Address">
            </div>

            <button class="btn" type="submit">
                Save & Continue
            </button>

        </form>

    </div>

</div>

{% endblock %}
