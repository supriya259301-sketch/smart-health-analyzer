{% extends "base.html" %}
{% block content %}

<h3>History</h3>

<table class="table">
<tr><th>Date</th><th>BP</th><th>Condition</th></tr>

{% for r in reports %}
<tr>
<td>{{r.date}}</td>
<td>{{r.sys}}/{{r.dia}}</td>
<td>{{r.condition}}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
