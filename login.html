{% extends "base.html" %}
{% block content %}

<style>
.auth-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
}

.auth-card {
    background: white;
    padding: 30px;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.auth-card h2 {
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.btn {
    width: 100%;
    padding: 10px;
    border: none;
    background: #0072ff;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.btn:hover {
    background: #005ce6;
}

.link {
    margin-top: 10px;
    display: block;
}
</style>

<div class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>

        <form method="POST">
            <div class="input-group">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button class="btn">Login</button>
        </form>

        <a class="link" href="/register">Create Account</a>
    </div>
</div>

{% endblock %}
